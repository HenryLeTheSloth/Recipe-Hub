services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: recipehub
      POSTGRES_USER: recipehub
      POSTGRES_PASSWORD: recipehub
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
