# Thông báo mặc định tiếng Việt cho ràng buộc không ghi message riêng (Hibernate Validator đọc UTF-8).
jakarta.validation.constraints.NotBlank.message=Bắt buộc
jakarta.validation.constraints.NotNull.message=Bắt buộc
jakarta.validation.constraints.NotEmpty.message=Bắt buộc
jakarta.validation.constraints.Size.message=${min > 0 ? 'Từ ' += min += ' đến ' += max += ' ký tự' : 'Tối đa ' += max += ' ký tự'}
jakarta.validation.constraints.Min.message=Tối thiểu {value}
jakarta.validation.constraints.Max.message=Tối đa {value}
jakarta.validation.constraints.DecimalMin.message=${inclusive ? 'Tối thiểu ' += value : 'Phải lớn hơn ' += value}
jakarta.validation.constraints.DecimalMax.message=${inclusive ? 'Tối đa ' += value : 'Phải nhỏ hơn ' += value}
jakarta.validation.constraints.Email.message=Email không hợp lệ
jakarta.validation.constraints.Digits.message=Tối đa {integer} chữ số phần nguyên và {fraction} chữ số thập phân
